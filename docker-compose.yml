# STENTH Operator V1.1 — local and single-VPS stack (SPEC.md §20).
#
# Day 1 brings up postgres, the migration step and web. worker arrives on Day 2,
# fetcher on Day 3, and the serving split on Day 9; each is added to this file on
# its own day rather than sitting here as a stub.
#
# Topology per §20: postgres publishes no host port at all. web publishes only
# on the loopback interface so it can be reached during development; on the VPS,
# docker-compose.prod.yml removes that.
#
# THE TARGET VPS IS SHARED. stenth-engine also runs the /opt/stenth stack —
# caddy, n8n, and an n8n-clients instance that is production for a paying
# client. Nothing under /opt/stenth is ours to modify, restart or redeploy.
# Three consequences are baked into this file:
#
#   1. Its own Compose project name, so `docker compose down` here can never
#      reach the other stack's containers.
#   2. Its own bridge network, project-scoped by that name.
#   3. A mem_limit on every container. The box has ~2.7 GB free of 4 GB, and an
#      Operator container that balloons must hit its own ceiling rather than
#      starve the client's n8n. Steady state is postgres 1 GiB + web 512 MiB +
#      worker 384 MiB + fetcher 320 MiB = 2.1875 GiB; the migration step adds
#      256 MiB while it runs. A cold image build needs roughly another 850 MiB,
#      measured, so builds happen with the stack down (ops/deploy.md).
#
# Ports 80 and 443 are already published by the existing Caddy, so Operator
# cannot bind them as §20 describes. That is an open deviation awaiting a
# decision — see ops/deviations.md. Nothing here publishes either port.

name: stenth-operator

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: operator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Backups run nightly at 02:30 Australia/Sydney (§18).
      TZ: Australia/Sydney
    # Sized to the mem_limit below rather than to the host, which is shared.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=50
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d operator"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Runs as its own step, before the new code serves traffic:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: tools
      secrets:
        - npm_ca
    profiles: ["migrate"]
    environment:
      NODE_ENV: production
      SERVICE_NAME: migrate
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL}
      OPERATOR_APP_PASSWORD: ${OPERATOR_APP_PASSWORD}
      OPERATOR_FETCH_PASSWORD: ${OPERATOR_FETCH_PASSWORD}
      OPERATOR_SCHED_PASSWORD: ${OPERATOR_SCHED_PASSWORD}
      OPERATOR_MIGRATE_PASSWORD: ${OPERATOR_MIGRATE_PASSWORD}
      OPERATOR_RO_PASSWORD: ${OPERATOR_RO_PASSWORD}
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # The single Node worker of §6: four handlers in-process, plus one timer
  # running the scheduler and the reaper. Internal network only, no host port.
  worker:
    build:
      context: .
      target: worker
      secrets:
        - npm_ca
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: worker
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      # The scheduler connects as operator_sched so §17's least privilege is
      # enforced by the connection, not by which statements it happens to run.
      #
      # Deliberately not ${...:?required}: that marker makes EVERY compose
      # command fail when the variable is missing, `down` and `logs` included,
      # so one absent line in .env would leave the stack un-stoppable. The
      # worker checks this itself at startup and exits with an explanation,
      # which fails just as fast and leaves the box operable.
      SCHED_DATABASE_URL: ${SCHED_DATABASE_URL}
      # Where the worker asks the fetcher to do the dangerous part (§8). An
      # internal DNS name on the project's own network, never a host port.
      FETCHER_URL: ${FETCHER_URL:-http://fetcher:8081}
      FETCHER_SHARED_SECRET: ${FETCHER_SHARED_SECRET}
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 384m
    memswap_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      fetcher:
        condition: service_started
    networks:
      - internal

  # The fetcher of §8: the only process that opens a connection to the public
  # internet and the only one that handles hostile input.
  #
  # No published host port, no model key, no mail credential, and a database URL
  # for operator_fetch — whose entire reach is a snapshot insert and the robots
  # cache. It cannot read back the text it writes.
  fetcher:
    build:
      context: .
      target: fetcher
      secrets:
        - npm_ca
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: fetcher
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FETCHER_PORT: 8081
      FETCH_DATABASE_URL: ${FETCH_DATABASE_URL}
      FETCHER_SHARED_SECRET: ${FETCHER_SHARED_SECRET}
      # DATABASE_URL is required by config.ts on boot but must never be the
      # application role here: the fetcher gets its own narrow connection and
      # this points at the same one, so a mistake cannot widen its reach.
      DATABASE_URL: ${FETCH_DATABASE_URL}
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 320m
    memswap_limit: 320m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    # No `ports:` key at all. The worker reaches it at http://fetcher:8081 on
    # the project's own network; nothing outside Docker can.
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  web:
    build:
      context: .
      target: web
      secrets:
        - npm_ca
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: web
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      AI_BUDGET_MONTHLY_USD: ${AI_BUDGET_MONTHLY_USD:-50}
      AI_BUDGET_WARN_USD: ${AI_BUDGET_WARN_USD:-35}
      AI_BUDGET_HARD_STOP_USD: ${AI_BUDGET_HARD_STOP_USD:-50}
      # Node's own ceiling, under the container limit, so an OOM is a clean
      # heap error in the logs rather than a kill the host has to explain.
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    ports:
      # Loopback only. Removed by docker-compose.prod.yml, where Caddy is the
      # only container with published host ports (§20).
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

# Optional, and only consumed at build time: see the Dockerfile's deps stage.
# NPM_CA_FILE points at a TLS-inspecting proxy's CA bundle on networks that need
# one. Unset, it resolves to an empty file and the build behaves normally.
secrets:
  npm_ca:
    file: ${NPM_CA_FILE:-/dev/null}

networks:
  # Project-scoped: docker names it stenth-operator_internal, which cannot
  # collide with the existing stack's network.
  internal:
    driver: bridge

volumes:
  postgres-data:
